name = "summify-proxy"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Set via: wrangler secret put GROQ_API_KEY
# (never commit real keys — use .dev.vars for local dev)

# ── Production routes ─────────────────────────────────────────────────────────
# After deploying (`wrangler deploy`), your worker will be reachable at:
#   https://summify-proxy.<your-cf-subdomain>.workers.dev
# Add that URL to ALLOWED_ORIGINS in worker/index.js, then set:
#   VITE_PROXY_URL=https://summify-proxy.<your-cf-subdomain>.workers.dev
# in your hosting provider's environment variables.